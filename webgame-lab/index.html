<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webgame Lab</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      /* Keep the canvas and body-mounted HUD in one stable viewport.
         Panels own scrolling; document scrollbars cause a resize loop. */
      html, body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
