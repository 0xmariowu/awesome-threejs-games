         Pip's kart rendered from the same camera and matted, the wordmark.

         the game loads, go green when it's ready, and Pip launches under the
         gantry as the camera flies after it into the grid screen.

      #kart-intro.is-go .ki-kart { animation: ki-launch .66s cubic-bezier(.5,0,.75,.45) both; }
      #kart-intro.is-go .ki-body { animation: none; }

      @keyframes ki-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes ki-push { from { transform: scale(1); } to { transform: scale(1.06); } }

      @keyframes ki-idle { from { transform: translateY(0); } to { transform: translateY(-.9%); } }
      @keyframes ki-puff { 0% { opacity: .75; transform: translate(-50%, -50%) scale(.35); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.7); } }
      @keyframes ki-fire { from { transform: translate(-50%, -50%) scale(.85); } to { transform: translate(-50%, -50%) scale(1.15); } }
