<body>
<main aria-label="Original character preview" data-demo-picture="" id="world"></main>
<aside class="ui-panel" data-demo-control="">

<select id="character"><option value="natsumi">Natsumi</option><option value="isogai">Dr. Isogai</option><option value="kid">Straw-hat boy</option></select>

<output data-demo-readout="" id="stats"></output>

<footer class="ui-panel" data-demo-control="" data-demo-hint="" data-hint-keys="Drag · Scroll">Drag to rotate · Wheel to zoom · Switch characters to cancel and rebuild</footer>
