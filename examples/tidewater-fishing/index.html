<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><link href="style.css" rel="stylesheet"/><title>Tidewater · Fishing simulation</title><link href="ui.css" rel="stylesheet"/></head><body>
<main><canvas aria-label="Fishing line and fish" data-demo-picture="" id="fishing-picture"></canvas>
<div class="setup" data-demo-control=""><label>Fish<select id="species"><option value="mullet">Striped mullet · 1 kg</option><option value="tuna">Blackfin tuna · 12 kg</option><option value="silverside">Hardhead silverside · 0.05 kg</option></select></label><label>Seed<input id="seed" max="4294967295" min="0" type="number" value="42"/></label></div>
<section class="sim ui-panel" data-demo-readout=""><div class="status"><strong aria-live="polite" id="outcome">Fighting</strong><span id="time">0.0 s</span></div><label class="gauge-label">Line tension <output id="tension-value">0.30</output></label><div class="gauge"><div class="safe-band"></div><div id="needle"></div></div><div class="scale"><span>Slack</span><span>Working band 0.30–0.85</span><span>Snap &gt; 1.00</span></div><div class="stats"><div><small>Line out</small><strong id="distance">15.0 m</strong></div><div><small>Fish stamina</small><strong id="stamina">100%</strong></div><div><small>Surge</small><strong id="surge">0%</strong></div></div></section><p class="hint" data-demo-control="" data-demo-hint="" data-hint-keys="Space · Hold / Release">Space / hold reel · Release to let out · Pause to inspect</p><div class="controls" data-demo-control=""><button id="reset">New fight</button><button data-console-en="Hold to reel" data-console-zh="按住收线" id="reel">Hold to reel · Space</button><button id="pause">Pause</button><button id="sell">Sell catch</button></div>
<section class="save"><div data-demo-readout=""><small>Fish hold / original save rules</small><p id="inventory">0 fish · $0</p></div></section><p data-demo-readout="" id="message" role="status"></p>
</main><script src="app.js" type="module"></script></body></html>
