<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="data:," rel="icon"/>
<title>Cloudkeep · Model workbench</title>
<link href="./src/ui.css" rel="stylesheet"/></head>
<body class="models-page">
<header class="models-header ui-panel ui-bar" data-demo-control="">
<div></div>
<a href="./index.html">Back to flight →</a>
</header>
<main class="models-layout">
<aside aria-label="Model list" class="model-library ui-panel" data-demo-control="">
<h2>Archived models <span id="model-count">18</span></h2>
<div id="model-list"></div>
</aside>
<section aria-label="Model preview" class="model-stage">
<div aria-label="Drag to rotate, wheel to zoom" data-demo-picture="" id="viewer"></div>
<div aria-label="Model display settings" class="model-toolbar panel" data-demo-control="">
<button aria-pressed="false" id="wireframe" type="button">Wireframe</button>
<button aria-pressed="true" id="vertex-colors" type="button">Vertex colors: on</button>
<button aria-pressed="false" data-console-en="Distant model" data-console-zh="远景模型" disabled="" id="distant" type="button">Show distant version</button>
</div>
<section aria-label="Model statistics" class="model-info panel" data-demo-readout=""><h2 id="model-name">Loading…</h2><dl id="model-stats"></dl></section>
<p class="viewer-hint" data-demo-control="" data-demo-hint="" data-hint-keys="Drag · Scroll">Drag to rotate · Wheel to zoom · Release for automatic turntable</p>
<p class="status panel" data-demo-readout="" id="status" role="status">Reading model manifest…</p>
</section>
</main>
<script src="./src/models.ts" type="module"></script>
</body>
</html>
