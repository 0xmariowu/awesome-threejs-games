<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phyllotaxis · Leaf arrangements</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./src/ui.css"><link rel="stylesheet" href="./src/style.css"></head>
<body><div id="world" data-demo-picture aria-label="Phyllotaxis · Leaf arrangements"><div class="scene-heading"><span class="eyebrow">Botanical studies</span><h1>Leaf arrangements</h1><p id="caption"></p></div>
<div class="specimen-tag"><span id="specimen-name">Spiral</span><strong id="hero-angle">137.5°</strong><small>Successive angle</small></div>
<div class="scene-footer"><span>Independent study · inspired by FABOTANIC</span><span><b id="organ-total">34</b> <span>Organs</span></span></div></div>
<section data-demo-control class="settings"><label>Arrangement <select id="type" aria-label="Arrangement"><option value="spiral">Spiral</option><option value="alternate">Alternate</option><option value="opposite">Opposite</option><option value="decussate">Decussate</option><option value="whorled">Whorled</option><option value="sunflower">Sunflower head</option></select></label><label><span>Divergence <output id="angle-value">137.5</output></span><input id="angle" aria-label="Divergence" type="range" min="120" max="180" step="0.1" value="137.5"></label><div class="angle-buttons" role="group" aria-label="Angle comparison"><button data-angle="135">135°</button><button data-angle="137.5">137.5°</button><button data-angle="140">140°</button></div><label><span>Leaf / seed count <output id="count-value">34</output></span><input id="count" aria-label="Leaf / seed count" type="range" min="12" max="100" step="1" value="34"></label><label><span>Internode spacing <output id="spacing-value">0.15</output></span><input id="spacing" aria-label="Internode spacing" type="range" min="0.06" max="0.3" step="0.01" value="0.15"></label><label><span>Size taper <output id="taper-value">0.65</output></span><input id="taper" aria-label="Size taper" type="range" min="0" max="0.9" step="0.05" value="0.65"></label><label><span>Seed <output id="seed-value">42</output></span><input id="seed" aria-label="Seed" type="number" min="0" max="999999" value="42"></label><label><input id="top" type="checkbox">Top-down view</label><p class="explanation">Try the sunflower head at 135°, 137.5° and 140°.</p><p class="explanation">Fixed arrangements lock the angle to their rule.</p></section>
<div data-demo-readout><p id="packing"></p></div>
<p data-demo-hint>Drag to orbit · scroll to zoom</p>
<script type="module" src="./src/main.js"></script></body></html>
