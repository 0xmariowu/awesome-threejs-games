<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tupi · Rain river</title><link rel="icon" href="data:,"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/ui.css"></head>
<body><canvas data-demo-picture aria-label="Tupi · Rain river"></canvas><section data-demo-control><h1>Tupi · Rain river</h1>
