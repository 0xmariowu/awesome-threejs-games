<title>しゃぼん玉日和</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Klee+One:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eef0e8;
    --ink: #4a4a42;
    --glow: rgba(255, 253, 246, 0.96);
    --shade: rgba(52, 58, 46, 0.35);
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; }
  body { font-family: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  .snd {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 253, 246, 0.35);
    background: rgba(60, 66, 56, 0.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center; padding: 0; cursor: pointer; opacity: 0.55; transition: opacity 0.3s ease; z-index: 3;
  }
  .snd:hover, .snd:focus-visible { opacity: 1; }
  .snd:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  .snd svg { width: 22px; height: 22px; fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .snd .spk { fill: var(--glow); stroke: none; }
  .snd .x { display: none; }
  .snd.muted .x { display: inline; }
  .snd.muted .w { display: none; }
  .title {
    position: fixed; top: max(8vh, 40px); right: max(7vw, 20px);
    writing-mode: vertical-rl; margin: 0;
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; font-weight: 600;
    font-size: clamp(30px, 5.4vw, 64px); letter-spacing: 0.32em; line-height: 1;
    color: var(--glow); text-shadow: 0 0 24px var(--shade), 0 1px 3px rgba(40, 44, 36, 0.3);
    pointer-events: none; user-select: none; transition: opacity 0.6s linear;
  }
  .title small {
    display: block; margin-top: 0.9em; margin-right: 0.4em;
    font-family: "Klee One", serif; font-weight: 400; font-size: 0.26em; letter-spacing: 0.4em; opacity: 0.9;
  }
  .hint .sub { display: block; margin-top: 0.7em; font-size: 0.82em; letter-spacing: 0.22em; opacity: 0.82; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(7vh + env(safe-area-inset-bottom, 0px)); margin: 0; padding-inline: 16px;
    text-align: center; font-size: clamp(13px, 1.5vw, 16px); letter-spacing: 0.28em;
    color: var(--glow); text-shadow: 0 0 14px var(--shade), 0 1px 2px rgba(40, 44, 36, 0.35);
    pointer-events: none; user-select: none; opacity: 0; transition: opacity 0.4s linear;
  }
  .loading {
    position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); z-index: 5;
  }
  .loading .box { display: grid; gap: 22px; justify-items: center; }
  .loading .mark { font-family: "Zen Old Mincho", serif; font-size: clamp(22px, 3vw, 34px); letter-spacing: 0.3em; color: var(--ink); }
  .loading .bub { width: 46px; height: 46px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.95) 0 6%, rgba(255,255,255,0) 14%),
      conic-gradient(from 40deg, rgba(255,120,190,0.55), rgba(120,210,255,0.55), rgba(255,230,120,0.55), rgba(160,255,190,0.5), rgba(255,120,190,0.55));
    -webkit-mask: radial-gradient(circle, transparent 58%, #000 70%); mask: radial-gradient(circle, transparent 58%, #000 70%);
    animation: floaty 3.2s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-9px) scale(1.04); } }
  #status { font-size: 13px; letter-spacing: 0.24em; color: var(--ink); opacity: 0.75; min-height: 1.5em; }
  @media (prefers-reduced-motion: reduce) { .loading .bub { animation: none; } }
  /* メニュー：ふだんは隠れていて、Esc で開く */
  .menu {
    position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px;
    background: rgba(238, 240, 232, 0.28); -webkit-backdrop-filter: blur(10px) saturate(1.05); backdrop-filter: blur(10px) saturate(1.05);
  }
  .menu .card {
    box-sizing: border-box; min-width: min(320px, 100%); max-width: 100%; padding: 34px 34px 26px; border-radius: 22px; display: grid; gap: 10px; justify-items: stretch;
    background: rgba(250, 250, 244, 0.72); border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 18px 50px rgba(40, 48, 36, 0.18), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
  }
  .menu .mark { text-align: center; font-family: "Zen Old Mincho", serif; font-weight: 600; font-size: 26px; letter-spacing: 0.3em; padding-left: 0.3em; color: var(--ink); margin: 0 0 14px; }
  .menu .mark small { display: block; margin-top: 8px; font-family: "Klee One", serif; font-weight: 400; font-size: 13px; letter-spacing: 0.34em; opacity: 0.7; }
  .menu button {
    appearance: none; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    font-family: "Klee One", serif; font-size: 17px; letter-spacing: 0.24em; color: var(--ink);
    background: rgba(255, 255, 255, 0.0); transition: background 0.2s ease;
  }
  .menu button:hover, .menu button:focus-visible { background: rgba(255, 255, 255, 0.75); outline: none; }
  .menu button:focus-visible { box-shadow: 0 0 0 2px rgba(74, 74, 66, 0.35); }
  .menu .keys { margin: 12px 0 0; text-align: center; font-size: 12px; letter-spacing: 0.2em; color: var(--ink); opacity: 0.55; }
  .menu-btn {
    position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 4;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 253, 246, 0.4); padding: 0; cursor: pointer;
    background: rgba(60, 66, 56, 0.2); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: var(--glow); font-size: 20px; line-height: 1; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .menu-btn.on { opacity: 0.7; pointer-events: auto; }
</style>
<canvas id="c"></canvas>
<h1 class="title" id="title" style="opacity:0">しゃぼん玉日和<small>風まかせの春</small></h1>
<p class="hint" id="hint">画面にふれて、しゃぼん玉を吹く<span class="sub">ドラッグで見まわせます</span></p>
<div class="menu" id="menu" hidden role="dialog" aria-label="メニュー">
  <div class="card">
    <div class="mark">しゃぼん玉日和<small>風まかせの春</small></div>
    <button type="button" data-act="resume">つづける</button>
    <button type="button" data-act="restart">最初から</button>
    <button type="button" data-act="sound">音：あり</button>
    <button type="button" data-act="fullscreen">全画面</button>
    <p class="keys">Esc で閉じる</p>
  </div>
</div>
<button class="menu-btn" id="menuBtn" type="button" aria-label="メニュー" hidden>≡</button>
<button class="snd" id="snd" type="button" aria-label="音を消す" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3.5 9.2h3.6l4.6-3.9v13.4l-4.6-3.9H3.5z"/><path class="w" d="M15.2 9.3a3.8 3.8 0 0 1 0 5.4"/><path class="w" d="M17.9 6.8a7.3 7.3 0 0 1 0 10.4"/><path class="x" d="M15.6 9.4l5 5.2M20.6 9.4l-5 5.2"/></svg>
</button>
<div class="loading" id="loading">
  <div class="box">
    <div class="bub" aria-hidden="true"></div>
    <div class="mark">しゃぼん玉日和</div>
    <div id="status">準備しています</div>
  </div>
</div>

      shown = true;
      var el = document.getElementById('status');
      if (el) el.textContent = '読み込みに失敗しました：' + String(msg || '').slice(0, 160);
    }
    window.__showLoadError = show;
    window.addEventListener('error', function (e) { if (e instanceof ErrorEvent) show(e.message); });
    window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show(r && (r.message || r)); });

    }, 20000);
  })();
